name: Build & Test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release build (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Portable logic (deadzone math + INI parsing) is standard C++ and tested here.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate menu descriptor
        run: python3 tools/validate_menu.py deadzone.menu.json

      - name: Validator self-tests (negative fixtures)
        run: python3 tools/test_validate_menu.py

      - name: Build and run logic tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
            tests/test_deadzone_math.cpp src/DeadzoneMath.cpp src/Config.cpp \
            src/HidMapping.cpp src/Activity.cpp src/PatternScanner.cpp src/Logger.cpp \
            -o /tmp/test_deadzone_math
          /tmp/test_deadzone_math

  build:
    needs: test
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Prepare release package (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release/CRDeadzone/ModMenuConfig | Out-Null
          Copy-Item build/${{ env.BUILD_TYPE }}/CRDeadzone.dll release/CRDeadzone/
          Copy-Item deadzone.menu.json release/CRDeadzone/
          Copy-Item README.md release/CRDeadzone/

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'github') { $tag = 'dev' }
          Compress-Archive -Path release/CRDeadzone -DestinationPath "release/CRDeadzone-$tag.zip" -Force

      - name: Upload dev artifact (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: CRDeadzone-dev
          path: release/CRDeadzone-*.zip

      - name: Upload to Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/CRDeadzone-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
